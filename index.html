<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tile Tones</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--tx:#b5dcff;--mu:#d2b8f2;--pk:#ff9bd2;--ln:#ffffff40}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:12px/1.4 'Jura','Trebuchet MS',sans-serif;background:linear-gradient(165deg,#4a2a8a 0%,#8b3f9f 50%,#d070b0 100%) fixed}
h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px;color:#ffd6ee;text-shadow:0 0 14px #ff9bd2,2px 2px 0 #5a2a86}
button,select,input{font:inherit;color:inherit}
button,select{background:#ffffff1f;border:2px solid var(--ln);border-radius:3px;padding:3px 7px;font-size:11px;cursor:pointer}
select option{background:#4a2a8a}
button:hover{border-color:#ffd6ee;background:#ffffff33}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ffd6ee;outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;background:#2b164699;backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;border-bottom:2px solid var(--ln)}
.g{display:flex;gap:4px;align-items:center}
#name,#bpm{background:#2b164688;border:2px solid var(--ln);border-radius:3px;padding:4px 8px;color:var(--tx)}
#name{width:120px;font-size:11px}#bpm{width:62px}
.ib{width:30px;height:30px;padding:0;display:grid;place-items:center}
.ib svg{width:14px;height:14px;fill:currentColor;shape-rendering:crispEdges}
.ib.act{background:var(--pk);border-color:var(--pk);color:#3a1660}
#play{background:var(--pk);border-color:var(--pk);color:#3a1660}
.hd .ib{width:26px;height:26px}
#sc{overflow-x:auto;padding:12px 0 40px}
#in{position:relative;display:inline-block;min-width:100%}
.trk{margin:0 0 18px}
.hd{position:sticky;left:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:min(100vw,640px);padding:4px 12px;border-left:4px solid var(--c)}
.hd select{border-color:var(--c)}
.hd input{width:70px;accent-color:var(--c)}
.bd{display:flex;padding:4px 12px 0 0}
.lb{position:sticky;left:0;z-index:2;background:#4a2a8ae6;width:48px;flex:none;padding-left:12px;color:var(--mu);font-size:10px}
.lb div,.sp{height:28px;line-height:28px}
.col{flex:none;padding:0 1px;display:flex;flex-direction:column}
.col.cur{outline:2px dashed #ffd6ee;outline-offset:-2px}
.col.ply{background:#ffffff2e}
.du{display:block;width:100%;height:26px;margin:1px 0;padding:0;font-size:10px;overflow:hidden;background:transparent;border:2px solid var(--c);color:var(--c);border-radius:2px}
.cell{display:block;height:26px;margin:1px 0;background:#ffffff1f;border-radius:2px;cursor:pointer}
.cell:hover{background:#ffffff4d}
.cell.on{background:var(--c);box-shadow:0 0 8px var(--c)}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.8;display:none;z-index:3;pointer-events:none}
#msg{color:var(--mu);font-size:11px;padding:0 12px}
body{text-transform:uppercase;letter-spacing:.05em;font-weight:500}
button,select,input{text-transform:inherit;letter-spacing:inherit}
h1{letter-spacing:.1em}
.du,.lb,#msg{letter-spacing:.04em}
@media(max-width:600px){header{gap:6px;padding:8px}#bpm{width:52px}#name{width:100px}}
.wz{margin:10px 12px;padding:10px;border:2px solid var(--ln);border-radius:3px;background:#2b164666}
.wz summary{cursor:pointer;font-weight:600;color:#ffd6ee}
.wz p{margin:8px 0;max-width:620px;line-height:1.5}
.wz .row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tab.act,.mk{background:var(--pk);border-color:var(--pk);color:#3a1660}
.cell.ht{outline:2px dotted #ffd6ee;outline-offset:-2px}
.cs{display:flex;padding-left:60px;margin-bottom:8px}
.cb{flex:none;border-left:1px solid var(--ln);padding:0 4px;font-size:11px;height:34px;overflow:hidden;white-space:nowrap}
.cb.sb{border-left:2px solid var(--pk)}
.cb b{display:block;color:#ffd6ee;height:16px}
.fb{color:#ffd6ee}
#md{position:fixed;inset:0;background:#1a0a30d9;z-index:20;display:grid;place-items:center;padding:12px}
#md[hidden]{display:none}
.mp{background:#3a2070;border:2px solid var(--ln);border-radius:4px;padding:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.mp h2{margin:0 0 6px;font-size:16px;color:#ffd6ee}
.mp p{margin:6px 0;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.ed{overflow-x:auto}
#sv{position:fixed;inset:0;background:#1a0a30e6;z-index:30;display:grid;place-items:center;padding:12px}
#sv[hidden]{display:none}
.svp{background:#3a2070;border:2px solid var(--ln);border-radius:4px;padding:22px 26px;text-align:center;max-width:320px;width:100%}
.spin{width:38px;height:38px;margin:0 auto 14px;border:4px solid #ffffff30;border-top-color:var(--pk);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#svt{font-size:13px;color:#ffd6ee;line-height:1.5}
#svs{margin-top:6px;color:var(--mu);font-size:11px}
.svp.done .spin{display:none}
button:disabled{opacity:.5;cursor:default}
</style></head><body>
<header>
 <h1>Tile Tones ✦</h1><button class="mk" id="mk">✦ Make a song</button>
 <input id="name" placeholder="Track name" value="My Track" aria-label="Track name">
 <div class="g"><button class="ib" id="first" title="Go to start" aria-label="Go to start"><svg viewBox="0 0 14 14"><rect x="1" y="2" width="2" height="10"/><polygon points="8,2 4,7 8,12"/><polygon points="13,2 9,7 13,12"/></svg></button><button class="ib" id="prev" title="Previous tile" aria-label="Previous tile"><svg viewBox="0 0 14 14"><rect x="2" y="2" width="2" height="10"/><polygon points="12,2 5,7 12,12"/></svg></button><button class="ib" id="play" title="Play" aria-label="Play"><svg viewBox="0 0 14 14"><polygon points="3,1 12,7 3,13"/></svg></button><button class="ib" id="pause" title="Pause" aria-label="Pause"><svg viewBox="0 0 14 14"><rect x="3" y="2" width="3" height="10"/><rect x="8" y="2" width="3" height="10"/></svg></button><button class="ib" id="stop" title="Stop" aria-label="Stop"><svg viewBox="0 0 14 14"><rect x="3" y="3" width="8" height="8"/></svg></button><button class="ib" id="next" title="Next tile" aria-label="Next tile"><svg viewBox="0 0 14 14"><polygon points="2,2 9,7 2,12"/><rect x="10" y="2" width="2" height="10"/></svg></button><button class="ib" id="last" title="Go to end" aria-label="Go to end"><svg viewBox="0 0 14 14"><polygon points="1,2 5,7 1,12"/><polygon points="6,2 10,7 6,12"/><rect x="11" y="2" width="2" height="10"/></svg></button><button class="ib" id="loop" title="Loop" aria-label="Loop"><svg viewBox="0 0 14 14"><path d="M2 7V3h8M12 7v4H4" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="9,0 14,3 9,6"/><polygon points="5,8 0,11 5,14"/></svg></button>
 </div>
 <label class="g">BPM <input id="bpm" type="number" min="40" max="240" value="100"></label>
 <label class="g"><input id="sync" type="checkbox"> Sync mode</label>
 <select id="ft" aria-label="Load a full track"></select>
 <div class="g"><select id="ni"></select><button id="addt">Add instrument</button></div>
 <div class="g"><button id="wav">Save WAV</button><button id="mp3">Save MP3</button></div>
</header>
<div id="sv" hidden role="status" aria-live="polite"><div class="svp" id="svp"><div class="spin"></div><div id="svt">Saving…</div><div id="svs">Please keep this tab open.</div></div></div>
<div id="md" hidden><div class="mp" id="mp"></div></div>
<p id="msg">Pick a full track to start, or use + Sample on a track to drop a clip in at the cursor. Click a cell to place a note. Click a tile's top number to change its length (in beats). Sync mode stretches tiles to real time so every instrument lines up.</p>
<div id="sc"><div id="in"></div></div>
<script src="full-track-samples.js"></script>
<script src="single-samples.js"></script>
<script>
const $=id=>document.getElementById(id);
const NM=['C','D','E','F','G','A','B'];
const INST={
 piano:{n:'Piano',c:'#ffc2e2'},guitar:{n:'Guitar',c:'#ffb8a8'},violin:{n:'Violin',c:'#d6b8ff'},
 digital:{n:'Digital',c:'#9fe8ff'},
 drums:{n:'Drums',c:'#b8ffd9',r:['Kick','Snare','Tom','Hi-hat']},
 cymbals:{n:'Cymbals',c:'#fff0a8',r:['Crash','Ride','Splash','China']}};
const DUR=[.25,.5,1,2,4],DL={.25:'¼',.5:'½',1:'1',2:'2',4:'4'},PPB=72,TW=28;
const mid=(r,o)=>{const i=14-r;return 60+12*(Math.floor(i/7)+o)+[0,2,4,5,7,9,11][i%7]};
const lab=(r,o)=>{const i=14-r;return NM[i%7]+(4+Math.floor(i/7)+o)};
const mk=k=>({k,o:0,v:.8,s:Array.from({length:8},()=>({n:[],d:1}))});
const S={loop:false,bpm:100,sync:false,cur:0,tracks:[mk('piano')]};

/* ---------- synthesis (all generated, no samples) ---------- */
function nb(c){if(!c._n){const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;c._n=b}return c._n}
function nz(c,d,t,len,type,f,q,g){const s=c.createBufferSource();s.buffer=nb(c);const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const e=c.createGain();e.gain.setValueAtTime(g,t);e.gain.exponentialRampToValueAtTime(.001,t+len);s.connect(fl);fl.connect(e);e.connect(d);s.start(t);s.stop(t+len+.05)}
function sw(c,d,t,f1,f2,tf,len,g){const o=c.createOscillator(),e=c.createGain();o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+tf);e.gain.setValueAtTime(g,t);e.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(e);e.connect(d);o.start(t);o.stop(t+len+.05)}
function env(c,d,t,u,pk,at,rel,dec){const g=c.createGain(),a=g.gain;a.setValueAtTime(.0001,t);a.linearRampToValueAtTime(pk,t+at);const e=t+Math.max(u,at+.02);dec?a.exponentialRampToValueAtTime(pk*dec,e):a.setValueAtTime(pk,e);a.exponentialRampToValueAtTime(.0001,e+rel);g.connect(d);return[g,e+rel]}
function osc(c,type,f,t,end,out,det){const o=c.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;o.connect(out);o.start(t);o.stop(end+.05);return o}
function lp(c,out,f){const l=c.createBiquadFilter();l.type='lowpass';l.frequency.value=f;l.connect(out);return l}
const SY={
 piano(c,d,f,t,u){const[g,e]=env(c,d,t,u,.35,.004,.1,.08);osc(c,'triangle',f,t,e,g);const h=c.createGain();h.gain.value=.3;h.connect(g);osc(c,'sine',f*2,t,e,h);osc(c,'sine',f*3,t,e,h)},
 guitar(c,d,f,t,u){const sr=c.sampleRate,L=Math.ceil(sr*(u+.3)),N=Math.max(2,Math.round(sr/f)),b=c.createBuffer(1,L,sr),x=b.getChannelData(0);let p=0;
  for(let i=0;i<L;i++){if(i<N){p=p*.5+(Math.random()*2-1)*.5;x[i]=p}else x[i]=.5*(x[i-N]+x[i-N+1])*.997}
  const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.setValueAtTime(1,t);g.gain.setValueAtTime(1,t+u);g.gain.linearRampToValueAtTime(0,t+u+.12);s.connect(g);g.connect(d);s.start(t);s.stop(t+u+.15)},
 violin(c,d,f,t,u){const[g,e]=env(c,d,t,u,.2,.14,.15),l=lp(c,g,Math.min(f*5,4000)),a=osc(c,'sawtooth',f,t,e,l,-6),b=osc(c,'sawtooth',f,t,e,l,6);
  const o=c.createOscillator(),lg=c.createGain();o.frequency.value=5.5;lg.gain.value=9;o.connect(lg);lg.connect(a.detune);lg.connect(b.detune);o.start(t);o.stop(e+.05)},
 digital(c,d,f,t,u){const[g,e]=env(c,d,t,u,.16,.005,.04,.3);osc(c,'square',f,t,e,lp(c,g,3500))}};
const CY=[[1.6,5000,9500,.5],[1.1,6500,4500,.3],[.5,7000,10000,.4],[1,3500,6000,.45]];
function mh(c,d,t,len,g,hp){const e=c.createGain(),h=c.createBiquadFilter();h.type='highpass';h.frequency.value=hp;e.gain.setValueAtTime(g,t);e.gain.exponentialRampToValueAtTime(.001,t+len);h.connect(e);e.connect(d);[2,3,4.16,5.43,6.79,8.21].forEach(x=>osc(c,'square',x*205.3,t,t+len,h))}
function perc(c,d,k,r,t,u){
 if(k=='drums'){
  if(r==0){sw(c,d,t,150,45,.1,.5,1.6);sw(c,d,t,60,40,.2,.4,.9);nz(c,d,t,.02,'bandpass',3000,.8,.7)}
  else if(r==1){nz(c,d,t,.24,'highpass',1400,.8,1.1);nz(c,d,t,.1,'bandpass',3500,1,.7);sw(c,d,t,230,170,.07,.14,.9);sw(c,d,t,350,250,.05,.1,.5)}
  else if(r==2){sw(c,d,t,210,95,.2,.5,1.4);nz(c,d,t,.03,'bandpass',2000,1,.4)}
  else{mh(c,d,t,.07,.16,7000);nz(c,d,t,.06,'highpass',9000,.7,.45)}
 }else{const[l,h,b,g]=CY[r],n=Math.max(.15,Math.min(l,u+.1));nz(c,d,t,n,'highpass',h,.5,g*1.3);nz(c,d,t,n,'bandpass',b,.6,g);mh(c,d,t,n,g*.22,h)}}
function note(c,d,tr,r,t,u){
 if(INST[tr.k].r)return perc(c,d,tr.k,r,t,u);
 SY[tr.k](c,d,440*2**((mid(r,tr.o)-69)/12),t,u)}

/* ---------- scheduling ---------- */
function mast(c){const p=c.createDynamicsCompressor(),m=c.createGain();p.threshold.value=-14;p.knee.value=10;p.ratio.value=6;m.gain.value=1.1;m.connect(p);p.connect(c.destination);return m}
const secs=s=>s.d*60/S.bpm;
function sched(c,d,t0,from){let mx=0;
 S.tracks.forEach(tr=>{const g=c.createGain();g.gain.value=tr.v;g.connect(d);let t=t0;
  for(let i=from;i<tr.s.length;i++){const s=tr.s[i],u=secs(s);s.n.forEach(r=>note(c,g,tr,r,t,u));t+=u}
  mx=Math.max(mx,t-t0)});return mx}
const maxLen=()=>Math.max(...S.tracks.map(t=>t.s.length));
let AC=null,st=null,PV=null;
function pv(fn){if(!PV)PV=new AudioContext();if(PV.state=='suspended')PV.resume();const m=mast(PV);fn(PV,m,PV.currentTime+.02)}
function preview(i){pv((c,m,t)=>S.tracks.forEach(tr=>{const s=tr.s[i];if(s)s.n.forEach(r=>note(c,m,tr,r,t,Math.min(secs(s),1.5)))}))}
function play(){
 if(AC&&st.paused){AC.resume();st.paused=0;return}
 stop();AC=new AudioContext();const m=mast(AC);
 const t0=AC.currentTime+.08,tot=sched(AC,m,t0,S.cur);st={t0,tot,paused:0,from:S.cur};tick()}
function pause(){if(AC&&!st.paused){AC.suspend();st.paused=1}}
function stop(){if(AC){AC.close();AC=null}clearPly()}
function clearPly(){$('in').querySelectorAll('.col.ply').forEach(e=>e.classList.remove('ply'));$('ph')&&($('ph').style.display='none')}
function tick(){
 if(!AC)return;const e=AC.currentTime-st.t0;
 if(e>st.tot+(S.loop?0:.3)){if(S.loop){stop();play()}else stop();return}
 const idx=S.tracks.map(tr=>{let t=0;for(let i=st.from;i<tr.s.length;i++){t+=secs(tr.s[i]);if(e<t)return i}return -1});
 $('in').querySelectorAll('.col').forEach(el=>el.classList.toggle('ply',e>=0&&idx[+el.closest('.trk').dataset.t]==+el.dataset.i));
 const ph=$('ph');
 if(S.sync&&st.from==0&&e>=0){ph.style.display='block';ph.style.left=(60+e*S.bpm/60*PPB)+'px'}else ph.style.display='none';
 requestAnimationFrame(tick)}
function go(n){const m=maxLen()-1;S.cur=Math.max(0,Math.min(m,S.cur+n));render();preview(S.cur);
 const c=$('in').querySelector('.col.cur');c&&c.scrollIntoView({inline:'center',block:'nearest'})}

/* ---------- UI ---------- */
function render(){
 $('in').innerHTML=S.tracks.map((tr,ti)=>{
  const I=INST[tr.k],R=I.r?I.r.length:15,sl=(SINGLE[tr.k]||[]).map((x,i)=>`<option value="${i}">${x.n}</option>`).join('');
  const opts=Object.keys(INST).map(k=>`<option value="${k}"${k==tr.k?' selected':''}>${INST[k].n}</option>`).join('');
  const oct=I.r?'':`<select data-a="oct" aria-label="Octave">${[-1,0,1].map(o=>`<option value="${o}"${o==tr.o?' selected':''}>Oct ${o>0?'+':''}${o}</option>`).join('')}</select>`;
  const lbs=Array.from({length:R},(_,r)=>`<div>${I.r?I.r[r]:lab(r,tr.o)}</div>`).join('');
  let bt=0;const cols=tr.s.map((s,i)=>{const b0=bt;bt+=s.d;return `<div class="col${i==S.cur?' cur':''}" data-i="${i}" style="width:${S.sync?s.d*PPB:TW}px"><button class="du" data-a="dur" title="Tile length in beats">${DL[s.d]}</button>${Array.from({length:R},(_,r)=>`<i class="cell${s.n.includes(r)?' on':''}" data-a="cell" data-r="${r}"></i>`).join('')}</div>`}).join('');
  return `<section class="trk" data-t="${ti}" style="--c:${I.c}"><div class="hd"><select data-a="inst" aria-label="Instrument">${opts}</select><select data-a="smp" aria-label="Insert sample at cursor"><option value="">+ Sample</option>${sl}</select>${oct}<input type="range" data-a="vol" min="0" max="1" step=".05" value="${tr.v}" aria-label="Volume"><button class="ib" data-a="add" title="Add tile" aria-label="Add tile">+</button><button class="ib" data-a="del" title="Remove last tile" aria-label="Remove last tile">−</button><button class="ib" data-a="rm" title="Remove instrument" aria-label="Remove instrument">×</button></div><div class="bd"><div class="lb"><div class="sp"></div>${lbs}</div>${cols}</div></section>`}).join('')+'<div id="ph"></div>'}
$('in').addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a,tr=S.tracks[+el.closest('.trk').dataset.t],col=el.closest('.col'),ci=col?+col.dataset.i:0;
 if(a=='cell'){const s=tr.s[ci],r=+el.dataset.r,k=s.n.indexOf(r);
  if(k<0){s.n.push(r);pv((c,m,t)=>note(c,m,tr,r,t,Math.min(secs(s),1.5)))}else s.n.splice(k,1);
  S.cur=ci;render()}
 else if(a=='dur'){const s=tr.s[ci];s.d=DUR[(DUR.indexOf(s.d)+1)%DUR.length];render()}
 else if(a=='add'){tr.s.push({n:[],d:1});render()}
 else if(a=='del'){if(tr.s.length>1)tr.s.pop();S.cur=Math.min(S.cur,maxLen()-1);render()}
 else if(a=='rm'){S.tracks.splice(S.tracks.indexOf(tr),1);S.cur=Math.min(S.cur,Math.max(0,maxLen()-1));render()}});
$('in').addEventListener('input',e=>{
 const el=e.target,a=el.dataset.a,tr=S.tracks[+el.closest('.trk').dataset.t];
 if(a=='smp'){if(el.value!=='')ins(tr,+el.value);else render();return}
 if(a=='inst'){tr.k=el.value;const R=INST[tr.k].r?4:15;tr.s.forEach(s=>s.n=s.n.filter(r=>r<R));render()}
 else if(a=='oct'){tr.o=+el.value;render()}
 else if(a=='vol')tr.v=+el.value});
const FULL=window.FULL_TRACKS||[],SINGLE=window.SINGLE_SAMPLES||{};
const DM={drums:{k:0,s:1,t:2,h:3},cymbals:{c:0,r:1,p:2,x:3}},DG={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
function parse(p,k,o){return p.split(' ').filter(Boolean).map(t=>{const[a,d]=t.split(':'),n=[];
 if(a!='-')a.split('+').forEach(x=>{let r;if(INST[k].r)r=DM[k][x];else{const m=x.match(/^([A-G])(\d)$/);if(!m)return;let i=(+m[2]-4-o)*7+DG[m[1]];while(i<0)i+=7;while(i>14)i-=7;r=14-i}if(r!=null&&!n.includes(r))n.push(r)});
 return{n,d:+d||1}})}
function ins(tr,i){const sp=parse(SINGLE[tr.k][i].p,tr.k,tr.o);
 while(tr.s.length<S.cur)tr.s.push({n:[],d:1});
 sp.forEach((s,j)=>{const x=S.cur+j;x<tr.s.length?tr.s[x]=s:tr.s.push(s)});
 pv((c,m,t)=>sp.forEach(s=>{const u=secs(s);s.n.forEach(r=>note(c,m,tr,r,t,u));t+=u}));
 S.cur=Math.min(S.cur+sp.length,maxLen()-1);render()}
$('ft').innerHTML='<option value="">Full tracks…</option>'+FULL.map((f,i)=>`<option value="${i}">${f.name}</option>`).join('');

const FEEL={calm:80,happy:110,energetic:130,sad:70,dreamy:85},PR={pop:'C G Am F',emo:'Am F C G',classic:'C Am F G',drive:'Am G F G'},CH={C:[0,2,4],Dm:[1,3,5],Em:[2,4,6],F:[3,5,0],G:[4,6,1],Am:[5,0,2]};

const FD=[4,2,1,.5,.25],rest=b=>{const o=[];for(const d of FD)while(b>=d-1e-9){o.push({n:[],d});b-=d}return o};

const sub=(p,f)=>({s:p.s.map(x=>({n:x.n.filter(f),d:x.d}))}),FILL=[1,1,2,2].map(r=>({n:[r],d:.5})),ROLL=[1,1,1,1,1,1,2,2].map(r=>({n:[r],d:.5}));

 if(role=='Intro'){const l=sub(A,r=>r%3==0);p=X=='mel'?g(B,A):X=='beat'?g(B,has(l)?l:A):B}
 else if(role=='Pre')p=g(D,X=='harm'?E:A);
 else if(role=='Bridge')p=X=='mel'?{s:[...A.s].reverse()}:X=='beat'?sub(A,r=>r!=0):A;
 else if(role=='Outro')p=g(C,A);

 else if(role=='Chorus'&&X=='mel'&&k>1&&A.s.every(x=>x.n.every(r=>r>=7)))p={s:A.s.map(x=>({n:x.n.map(r=>r-7),d:x.d}))};
 if(role=='Outro'){const l=[...p.s].reverse().find(x=>x.n.length);return[...loop(p,b-4),{n:X=='beat'?[0]:l?l.n:[],d:4}]}

function gen(){const P=M.p,bpm=FEEL[P.feel],U=Math.max(4,Math.round(P.min*bpm/16)),sc=SEC[P.min],sum=sc.reduce((a,x)=>a+x[1],0),c=sc.map(x=>Math.max(1,Math.round(U*x[1]/sum)));
 for(let d=U-c.reduce((a,x)=>a+x);d;){const j=c.indexOf(Math.max(...c));if(d<0&&c[j]<2)break;c[j]+=d>0?1:-1;d+=d>0?-1:1}
 const T={mel:[],beat:[],harm:[],pad:[]},cnt={Verse:0,Chorus:0},pr=PR[P.prog].split(' ');let bars=0;
 sc.forEach((x,i)=>{const role=x[0],n=c[i]*4,b=n*4,k=role in cnt?++cnt[role]:0;

 const tr=[{k:P.inst,o:0,v:.8,s:T.mel}];
 if(has(M.parts.beat.A))tr.push({k:'drums',o:0,v:.9,s:T.beat});

 $('msg').textContent=`Song ready: ${bars} bars, about ${fmt(bars*240/bpm)} at ${bpm} BPM. Press Play, or tweak any tile.`}
$('mk').onclick=()=>{M.step=1;M.part='A';S.bpm=FEEL[M.p.feel];md();$('md').hidden=false};
$('mp').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const a=b.dataset.m,X=XS[M.step-2],p=X&&M.parts[X][M.part];

 else if(a=='next'){if(M.step==2&&!has(M.parts.mel.A)){alert('Add a few notes to the Overall melody (A) first.');return}

const i16=a=>{const o=new Int16Array(a.length);for(let i=0;i<a.length;i++)o[i]=Math.max(-1,Math.min(1,a[i]))*32767;return o};
function wavBlob(b){const ch=b.numberOfChannels,n=b.length,sr=b.sampleRate,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
 const w=(o,s)=>[...s].forEach((x,i)=>v.setUint8(o+i,x.charCodeAt(0)));
 w(0,'RIFF');v.setUint32(4,36+n*ch*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*ch*2,true);

const nxt=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,30)));

async function mp3Blob(b){const enc=new lamejs.Mp3Encoder(2,b.sampleRate,128),L=i16(b.getChannelData(0)),R=i16(b.getChannelData(b.numberOfChannels>1?1:0)),out=[];

let busy=false;
async function exp(fmt){
 if(busy)return;
 if(!S.tracks.some(t=>t.s.some(s=>s.n.length))){alert('Add at least one note first.');return}
 const tot=Math.max(...S.tracks.map(t=>t.s.reduce((a,s)=>a+secs(s),0)));

 const btns=[$('wav'),$('mp3')];btns.forEach(x=>x.disabled=true);
 $('svp').classList.remove('done');$('sv').hidden=false;

  await nxt();
  sv('Building your song…');await nxt();
  const oc=new OfflineAudioContext(2,Math.ceil(44100*(tot+2)),44100),m=mast(oc);

   else{sv('Writing WAV…');await nxt();blob=wavBlob(buf);ext='wav';alert('MP3 encoder could not load (offline?). Saved as WAV instead.')}}
